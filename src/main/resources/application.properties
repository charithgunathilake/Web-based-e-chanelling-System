# ===================== Server =====================
server.port=8081

# ===================== Microsoft SQL Server Connection =====================
# Update these 3 values to match your own SQL Server instance.
# encrypt=true;trustServerCertificate=true  -> lets you connect to a local dev SQL Server
# without setting up a real SSL certificate.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=EChannelDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=dhamishka123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================== JSP View Resolver =====================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===================== Misc =====================
spring.main.banner-mode=off
logging.level.org.springframework.jdbc.core=INFO
